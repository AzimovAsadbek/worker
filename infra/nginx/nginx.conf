worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 10m;          # evidence uploads (API enforces UPLOAD_MAX_BYTES)
  client_body_timeout 30s;
  gzip on;
  gzip_types application/json text/plain;

  log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout main;       # no query strings / bodies (may contain personal data)
  error_log /dev/stderr warn;

  # Edge rate limits (the API has its own, finer limits)
  limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;   # CGNAT: many workers share one IP
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream api { server api:3000; keepalive 16; }

  server {
    listen 80;
    server_name _;
    location = /api/v1/health { proxy_pass http://api; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Security headers (HSTS, nosniff, frame-deny, referrer policy, CSP) are set by the API (helmet),
    # so they also apply when the API runs behind another proxy.

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never trust client-supplied chains
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
    }
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
    }
    location / { return 404; }
  }
}
